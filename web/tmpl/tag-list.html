{{ define "content"}}
    <div class="tags container-lg mx-2">

        <form class="flex flex-row gap-1" action="tags" method="post">
            <div class="w-1/2">
                <input type="text" name="name" placeholder="Tag" />
            </div>
            <div class="w-1/2">
                <button type="submit" class="btn-primary">
                    <svg class="fill-white w-4 h-4 inline">
                        <use xlink:href='{{ asset "img/solid.svg#plus" }}'></use>
                    </svg>
                    Add Tag
                </button>
            </div>
        </form>

        <div class="mx-1 my-2 grid gap-2 grid-cols-1 md:grid-cols-2 lg:grid-cols-3">
            {{ range $index, $tag := .tags }}

            <div class="rounded-sm overflow-hidden shadow-lg relative"
                 id="tag-{{ $index }}">
                <div class="p-3">
                    <div class="font-bold text-xl mb-2"> {{ $tag.Name }}</div>
                    <button type="button" class="absolute top-2 right-2" data-toggle="#tag-{{ $index }} form">
                        <svg class="fill-gray-500 w-5 h-5 inline">
                            <use xlink:href='{{ asset "img/regular.svg#pen-to-square" }}'></use>
                        </svg>
                    </button>


                    <form class="hidden" action="tags{{if (gt $tag.Id 0)}}/{{$tag.Id}}{{end}}" method="post">
                        <div>
                            <label class="inline" for="name">Name:</label>
                            <input type="text" id="name" name="name" value="{{$tag.Name}}" />
                        </div>
                        <div>
                            <label class="inline" for="color">Tag Color:</label>
                            <input type="color" id="color" name="color" value="{{$tag.Color}}" class="p-0" />
                        </div>

                        <div class="text-center">
                            <button type="button" class="btn-secondary" data-toggle="#tag-{{ $index }} form">
                                Cancel
                            </button>
                            <button type="submit" class="btn-primary">
                                Save
                            </button>
                        </div>
                    </form>
                </div>

                <div class="h-3" style="background-color: {{$tag.Color}}">

                </div>
            </div>



            {{end}}
        </div>


    </div>
{{end}}

{{ define "site-header"}}
    <script src='{{ asset "toggle.js" }}' defer></script>
{{end}}
