[tools]
go = "1.27"
"github:tailwindlabs/tailwindcss" = "4.3.3"

[tasks.css]
description = "Build the CSS (Tailwind)"
run = "tailwindcss -i web/styles/main.css -o web/static/main.css --minify"

[tasks.build]
description = "Build the Go binary"
depends = ["css"]
env = { CGO_ENABLED = "1" }
run = "go build -mod=vendor -o meal-planner"

[tasks.test]
description = "Run the Go tests"
env = { CGO_ENABLED = "1" }
run = "go test -mod=vendor ./..."

[tasks."dev:css"]
description = "Rebuild the CSS on changes"
run = "tailwindcss -i web/styles/main.css -o web/static/main.css --watch=always"

[tasks."dev:backend"]
description = "Start the Go server (port 8080)"
env = { CGO_ENABLED = "1" }
run = "go run -mod=vendor ."

[tasks.dev]
description = "Watch the CSS and start the Go server (http://localhost:8080/meal-planner)"
depends = ["dev:css", "dev:backend"]
